server {
  listen 80;
  server_name _;

  include /etc/nginx/conf.d/rate-limit.conf;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/conf.d/security-headers.conf;
  }

  # SSE / chat streaming must not be buffered - override above.
  include /etc/nginx/conf.d/streaming.conf;

  # Internal RAG service is never exposed directly.
  location /rag-internal/ {
    deny all;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    include /etc/nginx/conf.d/security-headers.conf;
  }
}