groups:
  - name: vedamind
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        annotations:
          summary: "Backend is unreachable"

      - alert: RAGDown
        expr: up{job="rag"} == 0
        for: 1m
        annotations:
          summary: "RAG service is unreachable"

      - alert: GuardrailFailClosedSpike
        expr: sum(rate(vedamind_guardrail_needs_review_total[5m])) > 10
        for: 5m
        annotations:
          summary: "High volume of fail-closed guardrail decisions"

      - alert: HighTokenUsage
        expr: sum(vedamind_llm_tokens_total) / 200000 > 0.8
        for: 10m
        annotations:
          summary: "Approaching daily LLM token budget"